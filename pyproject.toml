[project]
name = "nodeglass"
version = "0.1.0"
description = "Local source-code intelligence and static call exploration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3", "pydantic>=2.10,<3",
  "tree-sitter>=0.25,<0.27", "tree-sitter-python>=0.25,<0.26",
  "tree-sitter-javascript>=0.25,<0.26", "tree-sitter-typescript>=0.23,<0.24", "pathspec>=0.12,<1"
]

[project.scripts]
nodeglass = "backend.entry:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "pyinstaller>=6.12,<7"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend.app*", "backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
